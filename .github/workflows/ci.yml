name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database roles
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db/init-roles.sql

      # High and critical advisories in what ships (accepted exceptions with
      # reasons: docs/SECURITY_MODEL.md, "Dependencies").
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high

      - name: Validate Prisma schema and generate client
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://linguva_owner:linguva_owner_dev@localhost:5432/linguva_test

      - name: Check migrations match the schema
        run: >
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://linguva_owner:linguva_owner_dev@localhost:5432/linguva_shadow
          --exit-code

      - name: Validate GraphQL operations against the Admin API schema
        run: |
          pnpm graphql-codegen
          git diff --exit-code -- app/types/admin.generated.d.ts

      - name: No source files hidden by .gitignore
        run: pnpm check:ignored

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL with RLS, Redis, BullMQ)
        run: pnpm test:integration

      - name: Live test rehearsal (the dev-store suites against a simulated store; no network)
        run: pnpm test:live:rehearsal

      - name: Security tests (tenant isolation, payloads, XSS)
        run: pnpm test:security

      - name: Performance tests (fuzzy memory at 100,000 entries; large shop with 50,000 drafts, 5,000 jobs, 5,000 products; 20 shops at once and fair share)
        run: pnpm test:performance

      - name: Build (web app, worker, operator tools)
        run: pnpm build

      - name: Install Chromium for the UI tests
        run: pnpm exec playwright install --with-deps chromium

      - name: UI tests (Playwright; production build, simulated Shopify, axe accessibility, phone layout)
        run: |
          pnpm build:ui-preload
          pnpm exec playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
