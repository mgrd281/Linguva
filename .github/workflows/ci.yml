name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create database roles
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db/init-roles.sql

      - name: Validate Prisma schema and generate client
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://linguva_owner:linguva_owner_dev@localhost:5432/linguva_test

      - name: Check migrations match the schema
        run: >
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://linguva_owner:linguva_owner_dev@localhost:5432/linguva_shadow
          --exit-code

      - name: Validate GraphQL operations against the Admin API schema
        run: |
          pnpm graphql-codegen
          git diff --exit-code -- app/types/admin.generated.d.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL, RLS enforced)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
